<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT & Timesheet Tracker</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #219150; }
        .status { text-align: center; font-size: 13px; color: #7f8c8d; margin-top: 5px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #34495e; color: white; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Overtime Timesheet</h2>
    <div id="connectionStatus" class="status">Connecting to database...</div>

    <form id="otForm">
        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="hours">Overtime Hours:</label>
            <input type="number" id="hours" step="0.5" placeholder="e.g. 2.5" required>
        </div>
        <div class="form-group">
            <label for="note">Note / Description (Optional):</label>
            <input type="text" id="note" placeholder="Project name or task">
        </div>
        <button type="submit">Save Entry</button>
    </form>

    <table id="otTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Hours</th>
                <th>Note</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4">Loading data...</td></tr>
        </tbody>
    </table>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBoBzRCbYEkL-YgQdfs5Khyt9B4qKRFbxY",
        authDomain: "my-ot-30f1b.firebaseapp.com",
        projectId: "my-ot-30f1b",
        storageBucket: "my-ot-30f1b.firebasestorage.app",
        messagingSenderId: "809011122593",
        appId: "1:809011122593:web:fa8c6ad21e0ad472a73be0",
        measurementId: "G-2TV08LGLCR"
    };

    // Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const otCollection = collection(db, "overtime_entries");

    const statusDiv = document.getElementById("connectionStatus");
    const otForm = document.getElementById("otForm");
    const tableBody = document.getElementById("tableBody");

    // Real-time Live Listener
    const q = query(otCollection, orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
        tableBody.innerHTML = "";
        if (snapshot.empty) {
            tableBody.innerHTML = `<tr><td colspan="4">No entries found.</td></tr>`;
            statusDiv.innerText = "🟢 Database Connected (0 entries)";
            return;
        }

        snapshot.forEach((doc) => {
            const data = doc.data();
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${data.date}</td>
                <td>${data.hours} hrs</td>
                <td>${data.note || '-'}</td>
                <td><button class="delete-btn" onclick="deleteEntry('${doc.id}')">Delete</button></td>
            `;
            tableBody.appendChild(row);
        });

        statusDiv.innerText = `🟢 Live Database Connected (${snapshot.size} entries synced)`;
    }, (error) => {
        console.error("Firestore Error:", error);
        statusDiv.innerText = "🔴 Connection Error: Please check Firestore Security Rules.";
    });

    // Save Data
    otForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const date = document.getElementById("date").value;
        const hours = parseFloat(document.getElementById("hours").value);
        const note = document.getElementById("note").value;

        try {
            await addDoc(otCollection, {
                date: date,
                hours: hours,
                note: note,
                createdAt: new Date()
            });
            otForm.reset();
        } catch (err) {
            alert("Error saving data: " + err.message);
        }
    });

    // Delete Data
    window.deleteEntry = async (id) => {
        if (confirm("Are you sure you want to delete this entry?")) {
            try {
                await deleteDoc(doc(db, "overtime_entries", id));
            } catch (err) {
                alert("Error deleting entry: " + err.message);
            }
        }
    };
</script>

</body>
</html>
