<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime & Timesheet Tracker</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
            padding: 28px;
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .status-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .stats-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .stats-card .title {
            font-size: 13px;
            color: #1e40af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-card .value {
            font-size: 28px;
            font-weight: 800;
            color: #1e3a8a;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .table-wrapper {
            margin-top: 28px;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn-delete {
            padding: 6px 12px;
            background-color: #fef2f2;
            color: var(--danger-color);
            border: 1px solid #fecaca;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Overtime Timesheet</h1>
        <div id="connectionStatus" class="status-badge">Connecting to database...</div>
    </div>

    <div class="stats-card">
        <div class="title">Total Overtime Hours</div>
        <div id="totalHours" class="value">0.0 hrs</div>
    </div>

    <form id="otForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="hours">Overtime Hours</label>
                <input type="number" id="hours" step="0.5" placeholder="e.g. 2.5" required>
            </div>
            <div class="form-group full-width">
                <label for="note">Note / Description (Optional)</label>
                <input type="text" id="note" placeholder="Project name or task detail">
            </div>
        </div>
        <button type="submit" class="btn-submit">Save Entry</button>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Hours</th>
                    <th>Note</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading entries...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBoBzRCbYEkL-YgQdfs5Khyt9B4qKRFbxY",
        authDomain: "my-ot-30f1b.firebaseapp.com",
        projectId: "my-ot-30f1b",
        storageBucket: "my-ot-30f1b.firebasestorage.app",
        messagingSenderId: "809011122593",
        appId: "1:809011122593:web:fa8c6ad21e0ad472a73be0",
        measurementId: "G-2TV08LGLCR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const otCollection = collection(db, "overtime_entries");

    const statusDiv = document.getElementById("connectionStatus");
    const otForm = document.getElementById("otForm");
    const tableBody = document.getElementById("tableBody");
    const totalHoursDiv = document.getElementById("totalHours");

    // Real-time Sync Listener
    const q = query(otCollection, orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
        tableBody.innerHTML = "";
        let calculatedTotal = 0;

        if (snapshot.empty) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No entries recorded yet.</td></tr>`;
            statusDiv.innerText = "🟢 Database Connected (0 entries)";
            totalHoursDiv.innerText = "0.0 hrs";
            return;
        }

        snapshot.forEach((docSnapshot) => {
            const data = docSnapshot.data();
            const hoursVal = parseFloat(data.hours) || 0;
            calculatedTotal += hoursVal;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${data.date}</strong></td>
                <td>${hoursVal} hrs</td>
                <td style="color: var(--text-muted);">${data.note || '-'}</td>
                <td style="text-align: right;"><button class="btn-delete" onclick="deleteEntry('${docSnapshot.id}')">Delete</button></td>
            `;
            tableBody.appendChild(row);
        });

        totalHoursDiv.innerText = `${calculatedTotal.toFixed(1)} hrs`;
        statusDiv.innerText = `🟢 Live Database Connected (${snapshot.size} synced)`;
    }, (error) => {
        console.error("Firestore Error:", error);
        statusDiv.innerText = "🔴 Connection Error: Check Firebase Rules";
    });

    // Add Entry
    otForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const date = document.getElementById("date").value;
        const hours = parseFloat(document.getElementById("hours").value);
        const note = document.getElementById("note").value;

        try {
            await addDoc(otCollection, {
                date: date,
                hours: hours,
                note: note,
                createdAt: new Date()
            });
            otForm.reset();
        } catch (err) {
            alert("Error saving data: " + err.message);
        }
    });

    // Delete Entry
    window.deleteEntry = async (id) => {
        if (confirm("Are you sure you want to delete this entry?")) {
            try {
                await deleteDoc(doc(db, "overtime_entries", id));
            } catch (err) {
                alert("Error deleting entry: " + err.message);
            }
        }
    };
</script>

</body>
</html>
